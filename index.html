<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World 飘带动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #1f2937;
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background-color: #ffffff;
            color: #6366f1;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: #f3f4f6;
            color: #f43f5e;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .desc {
            margin-top: 1rem;
            color: #6b7280;
        }

        .ribbon-text {
            position: fixed;
            font-size: 5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1 0%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            pointer-events: none;
            display: none;
            z-index: 9999;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8));
            }
        }

        @media (max-width: 768px) {
            .ribbon-text {
                font-size: 3rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn" id="clickBtn">点击我</button>
    </div>
    
    <div class="ribbon-text" id="ribbonText">Hello World!</div>

    <script>
        const btn = document.getElementById('clickBtn');
        const ribbonText = document.getElementById('ribbonText');
        let isVisible = false;
        let animationFrame = null;

        btn.addEventListener('click', function() {
            if (isVisible) {
                // 隐藏文字
                isVisible = false;
                ribbonText.style.display = 'none';
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
            } else {
                // 显示文字并开始动画
                isVisible = true;
                ribbonText.style.display = 'block';
                animate();
            }
        });

        function animate() {
            if (!isVisible) return;

            const currentTime = Date.now() / 1000;
            const x = Math.sin(currentTime * 0.5) * (window.innerWidth / 2 - 150) + window.innerWidth / 2;
            const y = Math.cos(currentTime * 0.5) * (window.innerHeight / 2 - 150) + window.innerHeight / 2;
            const rotate = Math.sin(currentTime * 1) * 30;
            const scale = 1 + Math.sin(currentTime * 0.5) * 0.2;

            ribbonText.style.left = x + 'px';
            ribbonText.style.top = y + 'px';
            ribbonText.style.transform = 'translate(-50%, -50%) rotate(' + rotate + 'deg) scale(' + scale + ')';

            animationFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
