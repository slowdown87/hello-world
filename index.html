<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #1f2937;
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background-color: #ffffff;
            color: #6366f1;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: #f3f4f6;
            color: #f43f5e;
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .desc {
            margin-top: 1rem;
            color: #6b7280;
        }

        .ribbon-text {
            position: fixed;
            width: 600px;
            height: 150px;
            pointer-events: none;
            display: none;
            z-index: 9999;
        }

        .ribbon-text text {
            font-size: 60px;
            font-weight: bold;
            fill: url(#textGradient);
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5));
            }
            to {
                filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8));
            }
        }

        @media (max-width: 768px) {
            .ribbon-text {
                width: 400px;
                height: 100px;
            }
            
            .ribbon-text text {
                font-size: 40px;
            }
            
            .btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn" id="clickBtn">点击我</button>
    </div>
    
    <svg class="ribbon-text" id="ribbonText" width="600" height="150" viewBox="0 0 1000 200">
        <defs>
            <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#f43f5e"/>
            </linearGradient>
            <path id="ribbonPath" d="M0,100 Q250,50 500,100 T1000,100" fill="none" stroke="none"/>
        </defs>
        <text>
            <textPath href="#ribbonPath" text-anchor="middle" startOffset="50%">
                Hello World!
            </textPath>
        </text>
    </svg>

    <script>
        const btn = document.getElementById('clickBtn');
        const ribbonText = document.getElementById('ribbonText');
        const ribbonPath = document.getElementById('ribbonPath');
        let isVisible = false;
        let animationFrame = null;

        btn.addEventListener('click', function() {
            if (isVisible) {
                // 隐藏文字
                isVisible = false;
                ribbonText.style.display = 'none';
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
            } else {
                // 显示文字并开始动画
                isVisible = true;
                ribbonText.style.display = 'block';
                animate();
            }
        });

        function animate() {
            if (!isVisible) return;

            const currentTime = Date.now() / 1000;
            // 主路径：圆形运动
            const x = Math.sin(currentTime * 0.3) * (window.innerWidth / 2 - 200) + window.innerWidth / 2;
            const y = Math.cos(currentTime * 0.3) * (window.innerHeight / 2 - 200) + window.innerHeight / 2;
            
            // 增加抖动效果
            const jitterX = Math.sin(currentTime * 5) * 10;
            const jitterY = Math.cos(currentTime * 4) * 8;
            const jitterRotate = Math.sin(currentTime * 3) * 5;
            
            // 旋转和缩放
            const rotate = Math.sin(currentTime * 0.8) * 30 + jitterRotate;
            const scale = 1 + Math.sin(currentTime * 0.5) * 0.2;

            // 动态修改SVG路径，实现丝带弯曲效果
            const wave1 = Math.sin(currentTime * 2) * 30;
            const wave2 = Math.cos(currentTime * 1.5) * 20;
            const wave3 = Math.sin(currentTime * 1.8) * 25;
            ribbonPath.setAttribute('d', `M0,100 Q250,${50 + wave1} 500,${100 + wave2} T1000,${100 + wave3}`);

            ribbonText.style.left = (x + jitterX) + 'px';
            ribbonText.style.top = (y + jitterY) + 'px';
            ribbonText.style.transform = 'translate(-50%, -50%) rotate(' + rotate + 'deg) scale(' + scale + ')';

            animationFrame = requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
